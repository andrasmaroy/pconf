[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pconf"
version = "1.11.0"
description = "Hierarchical python configuration with files, environment variables, command-line arguments."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andras Maroy", email = "andras@maroy.hu" }]
keywords = ["configuration", "hierarchical"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["pyyaml", "deepmerge"]

[project.urls]
Homepage = "https://github.com/andrasmaroy/pconf"

[project.optional-dependencies]
test = ["pytest"]

[dependency-groups]
dev = [
    "codecov",
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["pconf"]

[tool.ruff]
target-version = "py311"
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
mccabe.max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pconf"]
branch = true

[tool.coverage.report]
show_missing = true
