[tools]
python = "3.12"

[tasks.test]
description = "Run the test suite"
run = "pytest"

[tasks.lint]
description = "Lint with flake8"
run = "flake8 . --count --max-complexity=10 --max-line-length=127 --statistics"

[tasks.format]
description = "Check formatting with black"
run = "black --check pconf tests"

[tasks.install]
description = "Install the project and its dependencies"
run = "pip install -e . && pip install -r requirements-dev.txt"
